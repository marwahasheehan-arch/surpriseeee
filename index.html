<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    color: white;
    animation: fadeIn 1.5s ease-in-out;
}

h1 {
    font-size: 28px;
    margin-bottom: 20px;
}

.flowers {
    font-size: 50px;
    margin: 20px 0;
    animation: float 3s ease-in-out infinite;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #ee9ca7;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff4e78;
    color: white;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
    <h1>Hey Tanvi 💕<br>Happy Valentine's Day</h1>

    <div class="flowers">
        🌹 🌹 🌹<br>
        🌼 Jasmine for your calm<br>
        🌹 Roses for your chaos
    </div>

    <button onclick="showMessage()">Click Me</button>

    <p id="hiddenMessage" style="display:none; margin-top:20px;">
        I'll keep it simple this year…<br>
        Just wanted to make you smile 😊
    </p>
</div>

<script>
function showMessage() {
    document.getElementById("hiddenMessage").style.display = "block";
}
</script>

</body>
</html>
